[project]
name = "allreduce-lab"
version = "0.1.0"
description = "A CPU, dependency-free lab for collective-communication algorithms (ring / tree / naive all-reduce): simulate the data movement, verify the volume formulas, model latency vs bandwidth, and parse real nccl-tests output."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "LancyZhao" }]
dependencies = []                     # core + simulator are stdlib only

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "ruff>=0.5,<1.0"]

[project.scripts]
allreduce-lab = "allreduce.cli:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["allreduce", "nccl"]
